apply plugin: 'com.android.application'

def versionProperties = new Properties()

def versionPropertiesFile =
    rootProject.file('version.properties')

if (versionPropertiesFile.exists()) {
    versionPropertiesFile.withInputStream {
        versionProperties.load(it)
    }
}

def appVersionCode =
    versionProperties['VERSION_CODE']?.toInteger() ?: 1

def appVersionName =
    versionProperties['VERSION_NAME'] ?: '1.0.0'

android {
    namespace = "com.trustiq.truebill"

    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.trustiq.truebill"

        minSdkVersion rootProject.ext.minSdkVersion

        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode appVersionCode

        versionName appVersionName

        testInstrumentationRunner
            "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and directories excluded from packaged assets.
            ignoreAssetsPattern =
                '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android.txt',
                ),
                'proguard-rules.pro',
            )
        }
    }
}

repositories {
    flatDir {
        dirs(
            '../capacitor-cordova-android-plugins/src/main/libs',
            'libs',
        )
    }
}

dependencies {
    implementation fileTree(
        include: ['*.jar'],
        dir: 'libs',
    )

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"

    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation project(':capacitor-android')

    testImplementation "junit:junit:$junitVersion"

    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"

    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON =
        file('google-services.json')

    if (
        servicesJSON.exists() &&
        servicesJSON.text
    ) {
        apply plugin:
            'com.google.gms.google-services'
    }
} catch (Exception error) {
    logger.info(
        "google-services.json not found, google-services plugin not applied. Push Notifications won't work",
    )
}